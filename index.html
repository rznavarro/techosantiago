    <!-- Schema.org JSON-LD FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta reparar un techo en Santiago?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Depende del origen de la filtración y de cuántos metros están comprometidos: sellar una unión de hojalatería no se parece en nada a cambiar un paño completo de cubierta. Por eso Techo Santiago no publica precios cerrados. La visita técnica cuesta $30.000, incluye diagnóstico en terreno y presupuesto por escrito, y se descuenta del trabajo si lo contratas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Atienden en mi comuna?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Techo Santiago trabaja principalmente en el sector oriente de Santiago (Lo Barnechea, Las Condes, Vitacura, La Reina, Peñalolén, El Arrayán, Huechuraba, Ñuñoa y Providencia), en Chicureo y en parcelas de agrado del Cajón del Maipo, Linderos y Mostazal. Fuera de esa zona se cotiza el traslado antes de agendar."
          }
        },
        {
          "@type": "Question",
          "name": "¿En cuánto tiempo pueden ir a ver mi techo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Normalmente entre 24 y 48 horas hábiles. En temporada de lluvia se prioriza a quienes tienen una filtración activa, así que si te está entrando agua, indícalo al escribir."
          }
        },
        {
          "@type": "Question",
          "name": "¿Pueden cotizar solo con fotos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con fotos del techo y del daño interior se puede dar una orientación inicial, pero el presupuesto formal se entrega después de subir al techo. Cotizar sin ver es la forma más rápida de que después aparezcan costos que nadie previó."
          }
        },
        {
          "@type": "Question",
          "name": "¿Trabajan cuando llueve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Las emergencias sí, con soluciones de contención para frenar el paso del agua. La reparación definitiva se hace con el techo seco, porque casi ningún sellante ni membrana adhiere bien sobre una superficie mojada."
          }
        }
      ]
    }
